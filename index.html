<!DOCTYPE html>
<html lang=pt-BR><head><meta charset=UTF-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Quilombo da Matemática</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#2b1a0e;color:#fff3e0;margin:0;padding:16px;text-align:center}
.caixa{max-width:680px;margin:auto;background:#4e2f17;padding:20px;border-radius:16px}
h1,h2{color:#ffb300;margin-top:0}
button{display:block;width:100%;max-width:320px;margin:10px auto;background:#ffb300;color:#2b1a0e;border:none;padding:14px;border-radius:10px;font-size:17px;font-weight:bold;cursor:pointer}
button.sec{background:#8a5a2b;color:#fff3e0}
input{padding:10px;font-size:18px;border-radius:8px;border:none;width:130px;text-align:center}
.cena{background:#2b1a0e;border:2px solid #ffb300;border-radius:14px;padding:14px;margin:12px 0}
.big{font-size:56px}
.trilha{display:flex;justify-content:center;align-items:center;gap:6px;margin:10px 0}
.pt,.ok,.no,.at{width:42px;height:42px;border-radius:50%;border:2px solid #ffb300;display:flex;align-items:center;justify-content:center;font-weight:bold}
.ok{background:#2e7d32;border-color:#2e7d32}
.no{background:#8a3b2b;border-color:#8a3b2b}
.at{background:#ffb300;color:#2b1a0e}
.lin{width:14px;height:4px;background:#ffb300}
.msg{min-height:24px;margin:8px 0;font-weight:bold;color:#ffd54f}
.peq{font-size:14px;margin:0 0 10px}
.yt{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:12px auto;max-width:420px}
.yc{aspect-ratio:1;background:#2b1a0e;border:2px solid #8a5a2b;border-radius:8px;padding:0;margin:0;max-width:none;width:auto;font-size:26px;display:flex;align-items:center;justify-content:center;color:#fff3e0;cursor:pointer}
.yc.sel{border-color:#ffb300;background:#6b4423}
.yc.dst{border-color:#66bb6a;background:#2e4a2e}
.p1{color:#ffb300}
.p2{color:#ef5350}
.res{display:flex;justify-content:center;gap:12px;margin:6px 0;font-size:16px}
.tec{display:flex;justify-content:center;gap:0;margin:12px auto;max-width:420px;border:3px solid #ffb300;border-radius:8px;overflow:hidden}
.tec svg{display:block;width:16.66%;height:auto}
.opt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.opt button{margin:0;max-width:none;padding:6px;background:#2b1a0e;border:3px solid #ffb300}
.opt svg{display:block;width:100%;height:auto}
</style></head><body><div class=caixa id=j></div>
<script>
const J=document.getElementById('j');
function menu(){
 J.innerHTML='<h1>Quilombo da Matemática</h1><p>Matemática com a cultura africana e afro-brasileira. Escolha uma opção:</p><button onclick=trilhas()>🌿 Trilhas de perguntas</button><button onclick=yoteMenu()>♟️ Yote jogável</button><button onclick=padroes()>🧵 Padrões de Tecidos Africanos</button><button onclick=autores()>✍️ Autores</button>';
}
const T=[
{n:'6º ano',t:'Números, divisão e frações',p:[
['🎲','Clareira do Mancala','Na clareira, as crianças jogam Mancala, um jogo africano com sementes. O tabuleiro tem 2 fileiras de 6 covas, e cada cova começa com 4 sementes.','Quantas sementes há no tabuleiro todo?',48],
['🌰','Roda do Oware','Em Gana, o jogo se chama Oware. Dois jogadores dividem as 48 sementes igualmente. Uma jogadora capturou 1/4 das sementes dela.','Quantas sementes ela capturou?',6],
['📖','Casa de Maria Firmina','Maria Firmina dos Reis, escritora nascida em São Luís, no Maranhão, publicou o romance Úrsula em 1859, uma obra contra a escravidão.','Em 2026, quantos anos se passaram desde 1859?',167],
['🌽','Roça comunitária','No quilombo, as famílias plantam em 5 roças. Cada roça tem 30 pés de mandioca.','Quantos pés de mandioca há nas 5 roças?',150],
['🍲','Mutirão da farinha','Para o mutirão, os 150 pés de mandioca serão divididos igualmente entre 6 famílias.','Quantos pés fica para cada família?',25]]},
{n:'7º ano',t:'Razão, proporção e porcentagem',p:[
['♟️','Jogo de tabuleiro','No jogo Yote, cada jogador começa com 12 peças. Um jogador já perdeu 25% das suas peças.','Quantas peças ele perdeu?',3],
['🌰','Disputa de sementes','Numa partida, para cada 3 sementes de Ana, Bia tem 2. Ana tem 15 sementes.','Quantas sementes Bia tem?',10],
['📖','Livro de Carolina','Carolina Maria de Jesus nasceu em 1914 e publicou Quarto de Despejo em 1960, um diário que conta a vida na favela.','Com quantos anos ela publicou o livro?',46],
['🏘️','Aldeia do quilombo','Uma aldeia tem 200 pessoas, e 35% são crianças.','Quantas crianças moram na aldeia?',70],
['🌾','Casa de farinha','Uma família produz 12 kg de farinha em 3 dias e mantém o mesmo ritmo.','Quantos kg ela produz em 5 dias?',20]]},
{n:'8º ano',t:'Equações, padrões e geometria',p:[
['♟️','Tabuleiro do Yote','O tabuleiro do Yote tem 5 linhas e 6 colunas de casas.','Quantas casas ele tem no total?',30],
['🧶','Padrão do tecido','Um tecido africano repete o padrão: 3, 6, 12, 24, ...','Qual é o próximo número?',48],
['📖','Biblioteca de Machado','Machado de Assis nasceu em 1839 e morreu em 1908.','Quantos anos ele viveu?',69],
['🌽','Roça retangular','A roça do quilombo é um retângulo de 12 m por 8 m.','Qual é a área, em metros quadrados?',96],
['🪵','Cerca da roça','Para proteger a mesma roça de 12 m por 8 m, a comunidade vai cercar todo o contorno.','Quantos metros de cerca são necessários?',40]]},
{n:'9º ano',t:'Pitágoras, potências e estatística',p:[
['♟️','Tabuleiro quadrado','Um tabuleiro de jogo africano é um quadrado de 8 casas por lado.','Quantas casas ele tem no total (8 elevado a 2)?',64],
['📏','Corda de 13 nós','Os construtores usavam cordas para marcar ângulos retos. Uma roça triangular tem catetos de 6 m e 8 m.','Quanto mede a hipotenusa, em metros?',10],
['📖','Lei 10.639','A Lei 10.639, de 2003, tornou obrigatório o ensino de história e cultura afro-brasileira nas escolas.','Em 2026, quantos anos se passaram desde 2003?',23],
['🌽','Colheita das aldeias','Quatro aldeias colheram 20, 30, 40 e 50 sacas de milho.','Qual foi a média de sacas por aldeia?',35],
['✊','Zumbi dos Palmares','Zumbi nasceu em 1655 e morreu em 20 de novembro de 1695, data que hoje é o Dia da Consciência Negra.','Com quantos anos Zumbi morreu?',40]]}
];
let tr,pa,sem,res;
function trilhas(){
 J.innerHTML='<h2>Escolha a trilha</h2>'+T.map(function(x,k){return '<button onclick=ini('+k+')>'+x.n+'</button><p class=peq>'+x.t+'</p>';}).join('')+'<button class=sec onclick=menu()>Voltar ao menu</button>';
}
function ini(k){tr=k;pa=0;sem=0;res=[];mostra();}
function barra(){
 var h='<div class=trilha>';
 for(var i=0;i<5;i++){
  var c='pt',s=String(i+1);
  if(i<pa){c=res[i]?'ok':'no';s=res[i]?'✔':'✖';}
  else if(i===pa){c='at';s='🚶';}
  h+='<div class='+c+'>'+s+'</div>';
  if(i<4){h+='<div class=lin></div>';}
 }
 return h+'</div>';
}
function mostra(){
 if(pa>=5){return fim();}
 var d=T[tr].p[pa];
 J.innerHTML='<h2>'+T[tr].n+' - Parada '+(pa+1)+' de 5</h2>'+barra()+'<div class=cena><div class=big>'+d[0]+'</div><h2>'+d[1]+'</h2><p>'+d[2]+'</p></div><p><b>'+d[3]+'</b></p><input type=number id=r><div class=msg id=fb></div><button id=bt onclick=conf()>Responder</button><p>Sementes: '+'🌰'.repeat(sem)+'</p>';
}
function conf(){
 var d=T[tr].p[pa];
 var campo=document.getElementById('r');
 var fb=document.getElementById('fb');
 if(campo.value===''){fb.textContent='Digite sua resposta.';return;}
 var v=Number(campo.value);
 var bt=document.getElementById('bt');
 if(v===d[4]){sem++;res[pa]=true;fb.textContent='Acertou! Você ganhou uma semente 🌰';}
 else{res[pa]=false;fb.textContent='Quase! A resposta era '+d[4]+'.';}
 bt.textContent='Seguir na trilha';
 bt.onclick=function(){pa++;mostra();};
}
function fim(){
 var ok=sem>=3;
 J.innerHTML='<h1>'+(ok?'Você chegou ao quilombo! ✊':'Quase lá!')+'</h1>'+barra()+'<div class=big>🌰</div><p>Você juntou '+sem+' de 5 sementes.</p><p>'+(ok?'Parabéns! Você completou a trilha.':'Tente de novo para chegar ao quilombo.')+'</p><button onclick=ini(tr)>Jogar de novo</button><button class=sec onclick=trilhas()>Outras trilhas</button><button class=sec onclick=menu()>Menu</button>';
}
var Y,yv,yr,ym,ys,yf,ypc,yx,yturno;
function yoteMenu(){
 J.innerHTML='<h2>Yote</h2><p>Jogo de tabuleiro de capturas, jogado em vários países da África Ocidental.</p><button onclick="yIni(true)">Contra o computador</button><button onclick="yIni(false)">Em dupla, no mesmo celular</button><button class=sec onclick=yRegras()>Como jogar</button><button class=sec onclick=menu()>Voltar ao menu</button>';
}
function yRegras(){
 J.innerHTML='<h2>Como jogar Yote</h2><p>O tabuleiro tem 5 linhas e 6 colunas. Cada jogador tem 12 peças de reserva.</p><p>Na sua vez, faça UMA ação: toque em “Colocar peça” e depois numa casa vazia, ou toque numa peça sua e depois numa casa vazia ao lado, para mover.</p><p>Para capturar, pule por cima de uma peça do adversário que esteja ao lado, caindo na casa vazia logo depois. Você captura essa peça e mais uma do adversário, que será tirada da reserva dele ou do tabuleiro.</p><p>Vence quem deixar o adversário sem peças.</p><button onclick=yoteMenu()>Voltar</button>';
}
function yIni(pc){
 Y=[];for(var i=0;i<30;i++){Y.push(0);}
 yr=[0,12,12];yv=1;ym=0;yf=false;ypc=pc;ys=-1;yx=false;
 yDes('Jogador 1, sua vez.');
}
function yNome(j){return (ypc&&j===2)?'Computador':'Jogador '+j;}
function yPecas(j){var n=yr[j];for(var i=0;i<30;i++){if(Y[i]===j){n++;}}return n;}
function yDes(msg){
 var h='<h2>Yote</h2><div class=msg>'+msg+'</div><div class=res><span class=p1>● Jogador 1: reserva '+yr[1]+'</span><span class=p2>● '+yNome(2)+': reserva '+yr[2]+'</span></div><div class=yt>';
 var dst=ys>=0?yDest(ys):[];
 for(var i=0;i<30;i++){
  var c='yc';
  if(i===ys){c+=' sel';}
  if(dst.indexOf(i)>=0&&!yx){c+=' dst';}
  var s=Y[i]===1?'<span class=p1>●</span>':(Y[i]===2?'<span class=p2>●</span>':'');
  h+='<button class="'+c+'" onclick=yClique('+i+')>'+s+'</button>';
 }
 h+='</div>';
 if(!yf){
  h+='<button onclick=yModoColocar()>'+(ym===1?'Colocando peça: toque numa casa vazia':'Colocar peça da reserva')+'</button>';
 }
 h+='<button class=sec onclick=yoteMenu()>Sair do jogo</button>';
 if(yf){h+='<button onclick=yIni(ypc)>Jogar de novo</button>';}
 J.innerHTML=h;
}
function yModoColocar(){
 if(yf||(ypc&&yv===2)){return;}
 if(yx){return;}
 ym=ym===1?0:1;ys=-1;
 yDes(ym===1?'Toque numa casa vazia para colocar a peça.':yNome(yv)+', sua vez.');
}
function yDest(i){
 var r=[],l=Math.floor(i/6),c=i%6;
 var d=[[-1,0],[1,0],[0,-1],[0,1]];
 for(var k=0;k<4;k++){
  var nl=l+d[k][0],nc=c+d[k][1];
  if(nl<0||nl>4||nc<0||nc>5){continue;}
  var n=nl*6+nc;
  if(Y[n]===0){r.push(n);}
 }
 return r;
}
function yCaps(i,j){
 var r=[],l=Math.floor(i/6),c=i%6,o=j===1?2:1;
 var d=[[-1,0],[1,0],[0,-1],[0,1]];
 for(var k=0;k<4;k++){
  var l1=l+d[k][0],c1=c+d[k][1],l2=l+2*d[k][0],c2=c+2*d[k][1];
  if(l2<0||l2>4||c2<0||c2>5){continue;}
  if(Y[l1*6+c1]===o&&Y[l2*6+c2]===0){r.push([l1*6+c1,l2*6+c2]);}
 }
 return r;
}
function yClique(i){
 if(yf||yx||(ypc&&yv===2)){return;}
 if(ym===1){
  if(Y[i]!==0){return;}
  Y[i]=yv;yr[yv]--;ym=0;ys=-1;
  yFimVez('');return;
 }
 if(Y[i]===yv){
  ys=(ys===i)?-1:i;
  yDes(ys>=0?'Toque numa casa verde para mover, ou numa peça do adversário para saltar e capturar.':yNome(yv)+', sua vez.');
  return;
 }
 if(ys>=0){
  var cp=yCaps(ys,yv);
  for(var k=0;k<cp.length;k++){
   if(cp[k][1]===i){yCapturar(ys,cp[k][0],cp[k][1]);return;}
  }
  if(Y[i]===0&&yDest(ys).indexOf(i)>=0){
   Y[i]=yv;Y[ys]=0;ys=-1;yFimVez('');return;
  }
  if(Y[i]===(yv===1?2:1)){
   for(var m=0;m<cp.length;m++){
    if(cp[m][0]===i){yCapturar(ys,i,cp[m][1]);return;}
   }
  }
 }
}
function yCapturar(de,meio,para){
 Y[de]=0;Y[meio]=0;Y[para]=yv;ys=-1;
 var o=yv===1?2:1;
 if(yr[o]>0){yr[o]--;yFimVez('Captura! '+yNome(yv)+' tirou 2 peças.');return;}
 var lista=[];
 for(var i=0;i<30;i++){if(Y[i]===o){lista.push(i);}}
 if(lista.length>0){
  if(yv===1&&!ypc||yv===1&&ypc){
   yx=true;
   var h2='<h2>Yote</h2><div class=msg>Captura! Escolha mais uma peça do adversário para tirar.</div><div class=yt>';
   for(var q=0;q<30;q++){
    var s2=Y[q]===1?'<span class=p1>●</span>':(Y[q]===2?'<span class=p2>●</span>':'');
    var cl='yc'+(Y[q]===o?' dst':'');
    h2+='<button class="'+cl+'" onclick=yTirar('+q+')>'+s2+'</button>';
   }
   J.innerHTML=h2+'</div>';
   return;
  }
  Y[lista[Math.floor(Math.random()*lista.length)]]=0;
 }
 yFimVez('Captura! '+yNome(yv)+' tirou 2 peças.');
}
function yTirar(q){
 var o=yv===1?2:1;
 if(Y[q]!==o){return;}
 Y[q]=0;yx=false;
 yFimVez('Captura! '+yNome(yv)+' tirou 2 peças.');
}
function yPode(j){
 if(yr[j]>0){for(var i=0;i<30;i++){if(Y[i]===0){return true;}}}
 for(var k=0;k<30;k++){
  if(Y[k]===j){if(yDest(k).length>0||yCaps(k,j).length>0){return true;}}
 }
 return false;
}
function yFimVez(msg){
 var o=yv===1?2:1;
 if(yPecas(o)===0||yPecas(yv)===0){
  yf=true;
  var v=yPecas(o)===0?yv:o;
  yDes('Fim de jogo! '+yNome(v)+' venceu!');return;
 }
 yv=o;
 if(!yPode(yv)){
  if(!yPode(o===1?2:1)){
   yf=true;
   var a=yPecas(1),b=yPecas(2);
   yDes('Fim de jogo! '+(a>b?'Jogador 1 venceu!':(b>a?yNome(2)+' venceu!':'Empate!'))+' Placar de peças: '+a+' a '+b+'.');return;
  }
  yv=yv===1?2:1;
  yDes(msg+' Sem jogadas possíveis, a vez passou para '+yNome(yv)+'.');
  if(ypc&&yv===2){setTimeout(yPc,900);}
  return;
 }
 yDes((msg?msg+' ':'')+'Vez de '+yNome(yv)+'.');
 if(ypc&&yv===2){setTimeout(yPc,900);}
}
function yPc(){
 if(yf||yv!==2){return;}
 var caps=[];
 for(var i=0;i<30;i++){
  if(Y[i]===2){var c=yCaps(i,2);for(var k=0;k<c.length;k++){caps.push([i,c[k][0],c[k][1]]);}}
 }
 if(caps.length>0){
  var s=caps[Math.floor(Math.random()*caps.length)];
  yv=2;yCapturar(s[0],s[1],s[2]);return;
 }
 var mov=[];
 for(var a=0;a<30;a++){
  if(Y[a]===2){var d=yDest(a);for(var b=0;b<d.length;b++){mov.push([a,d[b]]);}}
 }
 var vazias=[];
 for(var e=0;e<30;e++){if(Y[e]===0){vazias.push(e);}}
 if(yr[2]>0&&vazias.length>0&&(mov.length===0||Math.random()<0.6)){
  var casa=vazias[Math.floor(Math.random()*vazias.length)];
  Y[casa]=2;yr[2]--;yFimVez('');return;
 }
 if(mov.length>0){
  var m=mov[Math.floor(Math.random()*mov.length)];
  Y[m[1]]=2;Y[m[0]]=0;yFimVez('');return;
 }
 yFimVez('');
}
function svgT(cores,tipo){
 var s='<svg viewBox="0 0 60 120" xmlns="http://www.w3.org/2000/svg"><rect width="60" height="120" fill="'+cores[0]+'"/>';
 if(tipo===0){s+='<polygon points="30,10 52,60 30,110 8,60" fill="'+cores[1]+'"/><polygon points="30,35 42,60 30,85 18,60" fill="'+cores[2]+'"/>';}
 if(tipo===1){s+='<rect x="0" y="15" width="60" height="14" fill="'+cores[1]+'"/><rect x="0" y="53" width="60" height="14" fill="'+cores[2]+'"/><rect x="0" y="91" width="60" height="14" fill="'+cores[1]+'"/>';}
 if(tipo===2){s+='<polygon points="0,120 30,10 60,120" fill="'+cores[1]+'"/><polygon points="18,120 30,60 42,120" fill="'+cores[2]+'"/>';}
 if(tipo===3){s+='<circle cx="30" cy="60" r="26" fill="'+cores[1]+'"/><circle cx="30" cy="60" r="12" fill="'+cores[2]+'"/>';}
 if(tipo===4){s+='<rect x="6" y="6" width="48" height="48" fill="'+cores[1]+'"/><rect x="6" y="66" width="48" height="48" fill="'+cores[2]+'"/>';}
 return s+'</svg>';
}
var PAL=[['#c62828','#ffb300','#1b0f06'],['#1b5e20','#ffd54f','#b71c1c'],['#0d47a1','#ffb300','#fff3e0'],['#4a148c','#ffd54f','#2e7d32'],['#e65100','#1b0f06','#fff3e0']];
var PAD=[
{d:'Tecido kente (Gana): repetição de dois motivos',s:[0,1,0,1,0],r:1,o:[1,0,2]},
{d:'Tecido kente: repetição de três motivos',s:[0,2,4,0,2],r:4,o:[2,4,3]},
{d:'Tecido bogolan (Mali): o padrão é espelhado, igual dos dois lados',s:[3,1,0,1,'?'],r:3,o:[3,0,4]},
{d:'Tecido kente: dois motivos repetidos em dupla',s:[0,0,3,0,0],r:3,o:[3,0,2]},
{d:'Tecido africano: três motivos que se repetem',s:[2,3,4,2,3],r:4,o:[4,2,0]}
];
var pI,pE,pCor;
function padroes(){
 pI=-1;pE=0;
 J.innerHTML='<h2>Padrões de Tecidos Africanos</h2><p>Os tecidos africanos, como o kente, de Gana, e o bogolan, do Mali, têm estampas que se repetem e se espelham. Descubra a regra e escolha o pedacinho que falta na faixa!</p><button onclick=pProx()>Começar</button><button class=sec onclick=menu()>Voltar ao menu</button>';
}
function pProx(){
 pI++;
 if(pI>=PAD.length){return pFim();}
 var p=PAD[pI];
 pCor=PAL[pI%PAL.length];
 var f='<div class=tec>';
 for(var i=0;i<5;i++){
  var t=p.s[i];
  f+=(t==='?'?'<svg viewBox="0 0 60 120" xmlns="http://www.w3.org/2000/svg"><rect width="60" height="120" fill="#2b1a0e"/><text x="30" y="75" text-anchor="middle" font-size="50" fill="#ffb300">?</text></svg>':svgT(pCor,t));
 }
 f+='<svg viewBox="0 0 60 120" xmlns="http://www.w3.org/2000/svg"><rect width="60" height="120" fill="#2b1a0e"/><text x="30" y="75" text-anchor="middle" font-size="50" fill="#ffb300">?</text></svg></div>';
 if(p.s.indexOf('?')>=0){f=f.replace(/<svg viewBox="0 0 60 120" xmlns="http:\/\/www.w3.org\/2000\/svg"><rect width="60" height="120" fill="#2b1a0e"\/><text x="30" y="75" text-anchor="middle" font-size="50" fill="#ffb300">\?<\/text><\/svg><\/div>$/,'</div>');}
 var ops='';
 var lista=p.o.slice().sort(function(){return Math.random()-0.5;});
 for(var k=0;k<lista.length;k++){ops+='<button onclick=pConf('+lista[k]+')>'+svgT(pCor,lista[k])+'</button>';}
 J.innerHTML='<h2>Faixa '+(pI+1)+' de '+PAD.length+'</h2><p>'+p.d+'</p>'+f+'<p><b>Qual pedacinho completa a faixa?</b></p><div class=opt>'+ops+'</div><div class=msg id=pf></div><p>Acertos: '+'🧵'.repeat(pE)+'</p>';
}
function pConf(t){
